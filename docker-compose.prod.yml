services:
    ollama_qwen:
        image: ollama/ollama
        container_name: ollama_qwen
        ports:
            - '11434:11434'
        environment:
            - OLLAMA_NUM_PARALLEL=4
            - OLLAMA_MAX_LOADED_MODELS=2
            - OLLAMA_KEEP_ALIVE=20m
        volumes:
            - ollama_qwen_data:/root/.ollama
        restart: unless-stopped
    ollama_phi:
        image: ollama/ollama
        container_name: ollama_phi
        ports:
            - '11435:11434'
        environment:
            - OLLAMA_NUM_PARALLEL=6
            - OLLAMA_MAX_LOADED_MODELS=1
            - OLLAMA_KEEP_ALIVE=30m
        volumes:
            - ollama_phi_data:/root/.ollama
        restart: unless-stopped
    db:
        image: postgres
        restart: unless-stopped
        ports:
            - '5432:5432'
        env_file:
            - ./Clouva.Server/.env.production
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            retries: 5
    redis:
        image: redis:8
        restart: unless-stopped
        command: redis-server --requirepass redispass
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            retries: 5

    http_server:
        restart: unless-stopped
        build:
            context: Clouva.Server
            dockerfile: Dockerfile.prod
        env_file: './Clouva.Server/.env.production'
        ports:
            - '8080:8080'
        depends_on:
            - ollama_qwen
            - ollama_phi
            - db
            - redis

volumes:
    postgres_data:
    redis_data:
    ollama_qwen_data:
    ollama_phi_data:
